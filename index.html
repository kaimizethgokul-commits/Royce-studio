<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090f">
<title>Royce Studio v1.1</title>
<style>
:root{--bg:#09090f;--card:#15151e;--line:#2d2d3b;--text:#fff;--muted:#9d9dac;--accent:#8b5cf6}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.app{max-width:760px;margin:auto;padding:calc(env(safe-area-inset-top) + 14px) 12px calc(env(safe-area-inset-bottom) + 28px)}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}h1{margin:0;font-size:28px}.eyebrow{font-size:11px;font-weight:900;letter-spacing:.18em;color:#bca8ff;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:12px}button,select,input{font:inherit}
button{border:1px solid #343445;background:#242431;color:#fff;border-radius:14px;min-height:48px;padding:11px 14px;touch-action:manipulation}
button.primary{background:linear-gradient(135deg,#6d4ce8,#c43adb)}button.on{outline:2px solid #86efac}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.pads{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pad{height:110px;font-weight:900;font-size:18px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:12px}.tab{white-space:nowrap;min-height:42px}.tab.active{background:#fff;color:#111;font-weight:800}
.panel{display:none}.panel.active{display:block}.row{display:grid;gap:8px;margin:10px 0}.row label{font-size:11px;color:var(--muted);font-weight:800}
select,input[type=range],input[type=text]{width:100%}select,input[type=text]{background:#0b0b11;color:#fff;border:1px solid #343445;border-radius:12px;min-height:44px;padding:10px}
.status{font-size:12px;color:var(--muted);min-height:18px}.vocal-controls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:inline-block;font-size:10px;padding:5px 8px;border-radius:999px;background:#242431;color:#cfcfe0}
@media(max-width:520px){.grid,.vocal-controls{grid-template-columns:1fr}.pad{height:100px}}
</style>
</head>
<body>
<div class="app">
<header><div><p class="eyebrow">ROYCE</p><h1>Studio <span class="badge">v1.1 Core</span></h1></div><button id="audioBtn" class="primary">Enable Audio</button></header>

<div class="tabs">
<button class="tab active" data-tab="drums">Drums</button>
<button class="tab" data-tab="voice">Voice</button>
<button class="tab" data-tab="tune">Auto‑Tune</button>
</div>

<section id="drums" class="panel active">
<div class="card">
<p class="status" id="audioStatus">Tap Enable Audio once, then hit a pad.</p>
<div class="pads">
<button class="pad" data-drum="kick">KICK</button>
<button class="pad" data-drum="snare">SNARE</button>
<button class="pad" data-drum="hat">HAT</button>
<button class="pad" data-drum="clap">CLAP</button>
</div>
</div>
</section>

<section id="voice" class="panel">
<div class="card">
<h2>Voice Recorder</h2>
<p class="status" id="micStatus">Mic not armed.</p>
<div class="vocal-controls">
<button id="micBtn">Arm Microphone</button>
<button id="recBtn" disabled>Start Recording</button>
</div>
<audio id="player" controls style="width:100%;margin-top:12px"></audio>
</div>
</section>

<section id="tune" class="panel">
<div class="card">
<h2>Auto‑Tune</h2>
<p class="status">Dedicated vocal tuning controls. The correction engine will process recorded vocals in this v1.1 branch without blocking app startup.</p>
<div class="grid">
<div class="row"><label>Auto‑Tune</label><button id="tuneToggle">Off</button></div>
<div class="row"><label>Key</label><select id="key"><option>C</option><option>C#</option><option>D</option><option>D#</option><option>E</option><option>F</option><option>F#</option><option>G</option><option>G#</option><option>A</option><option>A#</option><option>B</option></select></div>
<div class="row"><label>Scale</label><select id="scale"><option value="major">Major</option><option value="minor">Minor</option></select></div>
<div class="row"><label>Strength <span id="strengthVal">70%</span></label><input id="strength" type="range" min="0" max="100" value="70"></div>
<div class="row"><label>Retune Speed <span id="speedVal">35 ms</span></label><input id="speed" type="range" min="5" max="120" value="35"></div>
<div class="row"><label>Humanize <span id="humanVal">20%</span></label><input id="human" type="range" min="0" max="100" value="20"></div>
</div>
<p class="status" id="tuneStatus">Auto‑Tune is off.</p>
</div>
</section>
</div>

<script>
let ctx=null,stream=null,recorder=null,chunks=[];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
async function audio(){
 try{
  if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
  if(ctx.state!=='running')await ctx.resume();
  $('#audioBtn').textContent='Audio Ready';$('#audioBtn').classList.add('on');$('#audioStatus').textContent='Audio engine running.';
  return ctx;
 }catch(e){$('#audioStatus').textContent='Audio error: '+(e.message||e);return null}
}
$('#audioBtn').onclick=async()=>{const c=await audio();if(!c)return;const o=c.createOscillator(),g=c.createGain(),t=c.currentTime;o.frequency.value=660;g.gain.setValueAtTime(.001,t);g.gain.exponentialRampToValueAtTime(.15,t+.01);g.gain.exponentialRampToValueAtTime(.001,t+.14);o.connect(g).connect(c.destination);o.start(t);o.stop(t+.16)};
function hit(name){
 const c=ctx;if(!c||c.state!=='running')return;
 const t=c.currentTime,o=c.createOscillator(),g=c.createGain();
 o.type=name==='kick'?'sine':name==='hat'?'square':'triangle';
 o.frequency.setValueAtTime(name==='kick'?140:name==='snare'?190:name==='hat'?6500:1200,t);
 if(name==='kick')o.frequency.exponentialRampToValueAtTime(48,t+.12);
 g.gain.setValueAtTime(name==='hat'?.05:.2,t);g.gain.exponentialRampToValueAtTime(.001,t+(name==='kick'?.2:.09));
 o.connect(g).connect(c.destination);o.start(t);o.stop(t+.25);
}
$$('.pad').forEach(p=>p.onclick=async()=>{const c=await audio();if(c)hit(p.dataset.drum)});
$$('.tab').forEach(t=>t.onclick=()=>{$$('.tab').forEach(x=>x.classList.remove('active'));$$('.panel').forEach(x=>x.classList.remove('active'));t.classList.add('active');$('#'+t.dataset.tab).classList.add('active')});
$('#micBtn').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({audio:true});$('#micStatus').textContent='Microphone ready.';$('#recBtn').disabled=false;$('#micBtn').classList.add('on')}catch(e){$('#micStatus').textContent='Mic permission failed: '+(e.message||e)}};
$('#recBtn').onclick=()=>{if(!stream)return;if(!recorder||recorder.state==='inactive'){chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=()=>{const b=new Blob(chunks,{type:recorder.mimeType||'audio/webm'});$('#player').src=URL.createObjectURL(b);$('#micStatus').textContent='Take recorded.'};recorder.start();$('#recBtn').textContent='Stop Recording';$('#micStatus').textContent='Recording…'}else{recorder.stop();$('#recBtn').textContent='Start Recording'}};
$('#tuneToggle').onclick=()=>{const on=!$('#tuneToggle').classList.contains('on');$('#tuneToggle').classList.toggle('on',on);$('#tuneToggle').textContent=on?'On':'Off';$('#tuneStatus').textContent=on?'Auto‑Tune armed for vocal processing.':'Auto‑Tune is off.'};
$('#strength').oninput=e=>$('#strengthVal').textContent=e.target.value+'%';
$('#speed').oninput=e=>$('#speedVal').textContent=e.target.value+' ms';
$('#human').oninput=e=>$('#humanVal').textContent=e.target.value+'%';
</script>
</body>
</html>
