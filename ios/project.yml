name: RoyceStudio
options:
  bundleIdPrefix: com.roycestudio
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: 5.0
    PRODUCT_BUNDLE_IDENTIFIER: com.roycestudio.app
    MARKETING_VERSION: 1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  RoyceStudio:
    type: application
    platform: iOS
    sources:
      - RoyceStudio
    info:
      path: RoyceStudio/Info.plist
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
